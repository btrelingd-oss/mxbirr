<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg-grad)" stroke="#334155" stroke-width="4"/>

  <!-- Glass Top Reflection -->
  <path d="M 30 120 Q 256 60 482 120 L 482 126 C 482 70 426 30 370 30 L 142 30 C 86 30 30 70 30 126 Z" fill="#ffffff" opacity="0.08"/>

  <!-- Yene Birr Golden Coin Vector -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Ring -->
    <circle r="150" fill="none" stroke="url(#gold-grad)" stroke-width="14" />
    <circle r="132" fill="#0f172a" opacity="0.9" />
    <circle r="126" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="6 6" />
    
    <!-- Central 'Br' Birr Currency Typo -->
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="2">ብር</text>
  </g>
</svg>
