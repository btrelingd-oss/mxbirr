<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="mx-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <linearGradient id="mx-cross" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ff3838"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#dc2626" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg-grad)" stroke="#334155" stroke-width="4"/>

  <!-- Glass Top Reflection -->
  <path d="M 30 120 Q 256 60 482 120 L 482 126 C 482 70 426 30 370 30 L 142 30 C 86 30 30 70 30 126 Z" fill="#ffffff" opacity="0.08"/>

  <!-- MX Monogram Vector -->
  <g filter="url(#shadow)" transform="translate(48, 80)">
    <!-- Left vertical bar of M -->
    <path d="M 40 50 L 100 50 L 100 280 L 40 280 Z" fill="url(#mx-red)" />

    <!-- Center V of M into diagonal -->
    <path d="M 100 50 L 190 190 L 280 50 L 340 50 L 410 280 L 350 280 L 270 120 L 190 250 L 140 250 L 100 110 V 50 Z" fill="url(#mx-red)" />

    <!-- Crossing bar of X -->
    <path d="M 200 280 L 260 280 L 410 50 L 350 50 Z" fill="url(#mx-cross)" />
  </g>
</svg>
